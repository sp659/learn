# ================================================================
#  CARINA FRAMEWORK CONFIGURATION FILE
#  Location: src/main/resources/_config.properties
#
#  This file is the MASTER configuration for the entire framework.
#  Carina reads this file at startup to configure:
#    - Browser settings
#    - Test environment URLs
#    - Timeout values
#    - Reporting options
#    - Thread/parallel execution settings
#
#  TIP FOR FRESHERS:
#  You can override any property via command line:
#  mvn clean test -Dbrowser=firefox -Denv=staging
# ================================================================


# ---------------------------------------------------------------
# ENVIRONMENT CONFIGURATION
# The base URL of the application under test.
# You can have multiple environments (dev, qa, staging, prod)
# and switch between them using -Denv=qa on the command line.
# ---------------------------------------------------------------
env=demo
url=https://www.saucedemo.com

# Individual environment URLs (selected by 'env' property)
env.url.demo=https://www.saucedemo.com
env.url.staging=https://staging.saucedemo.com
env.url.prod=https://www.saucedemo.com


# ---------------------------------------------------------------
# BROWSER CONFIGURATION
# Supported values: chrome, firefox, safari, edge
# ---------------------------------------------------------------
browser=chrome

# Run tests in headless mode (no browser UI) — great for CI/CD
headless_mode=false

# Keep browser open between tests in the same thread
keep_user_session=false

# Browser window dimensions
browser_width=1920
browser_height=1080


# ---------------------------------------------------------------
# TIMEOUT CONFIGURATION (all values in seconds)
# ---------------------------------------------------------------
# How long to wait for a page element to appear
explicit_timeout=20

# How long to wait for a page to fully load
page_load_timeout=30

# Short wait used for quick checks
retry_interval=2

# ---------------------------------------------------------------
# THREAD CONFIGURATION
# Controls how many browser instances run simultaneously.
# Set to 1 for local development, increase for CI pipelines.
# ---------------------------------------------------------------
thread_count=1
data_provider_thread_count=1


# ---------------------------------------------------------------
# SCREENSHOT SETTINGS
# ---------------------------------------------------------------
# Take screenshot on test failure (yes/no)
auto_screenshot=yes

# Keep screenshots even for passing tests
keep_all_screenshots=no


# ---------------------------------------------------------------
# LOGGING CONFIGURATION
# ---------------------------------------------------------------
# Log level: ERROR, WARN, INFO, DEBUG, TRACE
log_level=INFO


# ---------------------------------------------------------------
# PROXY CONFIGURATION (leave empty if not using a proxy)
# ---------------------------------------------------------------
proxy_host=
proxy_port=
proxy_protocols=http,https


# ---------------------------------------------------------------
# ZEBRUNNER REPORTING (Optional - for Zebrunner SaaS integration)
# Leave empty to run without Zebrunner cloud reporting.
# ---------------------------------------------------------------
# reporting.server.hostname=https://mycompany.zebrunner.com
# reporting.server.access-token=YOUR_ACCESS_TOKEN


# ---------------------------------------------------------------
# WEBDRIVER MANAGER (ChromeDriver/GeckoDriver auto-management)
# Carina uses WebDriverManager to auto-download the correct
# browser driver — no manual driver installation needed!
# ---------------------------------------------------------------
wdm_cache_path=~/.wdm
